name: CI

# Every push and pull request: type check, then the tests, which include
#  - regression tests on frozen filings that broke earlier versions (tests/regressions.test.ts)
#  - accounting checks on all ~500 companies in public/data (tests/data-checks.test.ts)
#  - the snapshot quality gate (tests/qa-gate.test.ts)
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
