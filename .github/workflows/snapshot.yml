name: Monthly data snapshot

on:
  schedule:
    - cron: '0 6 2 * *' # 06:00 UTC on the 2nd of every month
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated tickers (blank = full S&P 500)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            npx tsx scripts/snapshot.ts --only "${{ inputs.only }}"
          else
            npx tsx scripts/snapshot.ts
          fi

      - name: Test the new data
        env:
          DATA_CHECKS_MODE: snapshot # stale data exceptions warn instead of failing; see tests/data-checks.test.ts
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Keep the new data for inspection when the tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-data
          path: public/data
          retention-days: 7

      - name: Disk and data size
        if: always()
        run: |
          df -h /
          du -sh public/data || true

      - name: Commit data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: monthly snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report companies held back and stale exceptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const q = require("./public/data/qa.json");
            const held = Object.entries(q.heldBack ?? {});
            const stale = q.staleExceptions ?? [];
            if (!held.length && !stale.length) process.exit(0);
            const lines = ["The data was published. These need a look; nothing is blocked.", ""];
            if (held.length) {
              lines.push("**Held back** (new data failed a check, so the company keeps last month'"'"'s file or, if new to the index, is left out). Fix the extraction, or add the filing problem to `tests/data-exceptions.json`:", "");
              for (const [t, why] of held) lines.push(`- ${t}: ${why.join("; ")}`);
              lines.push("");
            }
            if (stale.length) lines.push("**Stale exceptions** (the filing problem is gone; remove from `tests/data-exceptions.json`): " + stale.join(", "), "");
            require("fs").writeFileSync("issue.md", lines.join("\n"));
          '
          if [ -f issue.md ]; then
            gh issue create --title "Monthly data snapshot: companies to check ($(date -u +%Y-%m-%d))" --body-file issue.md
          fi

      - name: Keep the schedule alive
        uses: liskin/gh-workflow-keepalive@v1

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Monthly data snapshot failed ($(date -u +%Y-%m-%d))" \
            --body "The snapshot run failed and no data was changed; the site keeps last month's data. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
