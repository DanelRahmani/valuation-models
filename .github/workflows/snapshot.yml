name: Monthly data snapshot

on:
  schedule:
    - cron: '0 6 2 * *' # 06:00 UTC on the 2nd of every month
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated tickers (blank = full S&P 500)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            npx tsx scripts/snapshot.ts --only "${{ inputs.only }}"
          else
            npx tsx scripts/snapshot.ts
          fi

      - name: Disk and data size
        if: always()
        run: |
          df -h /
          du -sh public/data || true

      - name: Commit data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: monthly snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep the schedule alive
        uses: liskin/gh-workflow-keepalive@v1

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Monthly data snapshot failed ($(date -u +%Y-%m-%d))" \
            --body "The snapshot run failed and no data was changed; the site keeps last month's data. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
